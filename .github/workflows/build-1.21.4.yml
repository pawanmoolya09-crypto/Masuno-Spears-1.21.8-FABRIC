
name: Build Accurate Spears for Minecraft 1.21.4

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Retarget project to Minecraft 1.21.4
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          props = Path('gradle.properties')
          text = props.read_text()
          values = {
              'minecraft_version': '1.21.4',
              'yarn_mappings': '1.21.4+build.8',
              'loader_version': '0.16.9',
              'loom_version': '1.9.2',
              'fabric_version': '0.119.4+1.21.4',
          }
          for key, value in values.items():
              pattern = rf'(?m)^{re.escape(key)}=.*$'
              if not re.search(pattern, text):
                  raise SystemExit(f'Missing {key} in gradle.properties')
              text = re.sub(pattern, f'{key}={value}', text)
          props.write_text(text)

          wrapper = Path('gradle/wrapper/gradle-wrapper.properties')
          wrapper_text = wrapper.read_text()
          wrapper_text = re.sub(
              r'(?m)^distributionUrl=.*$',
              r'distributionUrl=https\://services.gradle.org/distributions/gradle-8.11.1-bin.zip',
              wrapper_text,
          )
          wrapper.write_text(wrapper_text)

          metadata_path = Path('src/main/resources/fabric.mod.json')
          metadata = json.loads(metadata_path.read_text())
          metadata.setdefault('depends', {})['minecraft'] = '~1.21.4'
          metadata['depends']['fabricloader'] = '>=0.16.9'
          metadata_path.write_text(json.dumps(metadata, indent=2) + '\n')
          PY

      - name: Build mod
        run: bash ./gradlew --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: accurate-spears-fabric-minecraft-1.21.4
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if the build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: accurate-spears-build-reports
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
